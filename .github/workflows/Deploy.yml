name: SPRING-BOOT-APP CICD PIPELINE
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
## CHECKOUT CODE
      - name: Checkout code
        uses: actions/checkout@v3
## SETTING UP JAVA
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
## BUILD PROJECT
      - name: Build project
        run: mvn clean package -DskipTests
## DOCKER login
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
## BUILD DOCKER IMAGE
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
## PUSH DOCKER IMAGE
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} 
      